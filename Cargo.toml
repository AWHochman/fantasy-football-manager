[package]
name = "fantasy-football-manager"
version = "0.1.0"
edition = "2021"
description = "Read-only fantasy football roster monitoring clients"
license = "MIT"

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
